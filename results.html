<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Matches - Stitch AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0;">

    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
        <div style="display: flex; align-items: center; gap: 10px; color: #fff; font-size: 1.2rem; font-weight: bold; cursor: pointer;" onclick="window.location.href='index.html'">
            <span style="background: #6366f1; padding: 6px 10px; border-radius: 8px;">👕</span> Stitch <span style="color: #818cf8; font-weight: normal;">AI Finder</span>
        </div>
        <nav style="display: flex; gap: 30px;">
            <a href="index.html" style="color: #cbd5e1; text-decoration: none;">Home</a>
            <a href="guide.html" style="color: #cbd5e1; text-decoration: none;">How It Works</a>
        </nav>
    </header>

    <main style="padding: 40px 20px; max-width: 900px; margin: 0 auto;">
        <h1 style="color: #fff; text-align: center; margin-bottom: 10px;">Finding Your Garment...</h1>
        <p style="color: #94a3b8; text-align: center; margin-bottom: 40px;">Scanning the database for matching items based on your criteria.</p>

        <!-- Loading Text -->
        <div id="loadingSpinner" style="color: #818cf8; text-align: center; padding: 20px; font-size: 1.2rem; font-weight: bold;">
            Searching database... 🔍
        </div>
        
        <!-- Detailed Error Box -->
        <div id="errorMessage" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; padding: 20px; border-radius: 12px; margin-bottom: 20px; line-height: 1.6;">
            <!-- Errors will be printed here -->
        </div>

        <div id="resultsGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
            <!-- Database results will appear here -->
        </div>

        <div style="text-align: center; margin-top: 40px;">
             <a href="index.html" style="color: #818cf8; text-decoration: none; font-weight: bold;">← Back to Search</a>
        </div>
    </main>

    <!-- Connects to the new javascript file -->
    <script type="module" src="results.js"></script>
</body>
</html>
