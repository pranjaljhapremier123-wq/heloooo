<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stitch AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div style="background: #111827; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center;">
        
        <div style="font-size: 2.5rem; margin-bottom: 15px;"><span style="background: #6366f1; padding: 10px 15px; border-radius: 12px;">👕</span></div>
        <h2 style="color: #fff; margin-top: 0; margin-bottom: 30px;">Welcome to Stitch AI</h2>
        
        <div id="authError" style="display: none; color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem;">
            <!-- Errors will appear here -->
        </div>

        <input type="email" id="emailInput" placeholder="Email Address" style="width: 100%; padding: 14px 16px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; box-sizing: border-box; margin-bottom: 15px;">
        <input type="password" id="passwordInput" placeholder="Password" style="width: 100%; padding: 14px 16px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; box-sizing: border-box; margin-bottom: 20px;">
        
        <button id="loginBtn" style="width: 100%; padding: 14px; background: #6366f1; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-bottom: 20px;">
            Sign In / Create Account
        </button>

        <div style="display: flex; align-items: center; margin: 20px 0; color: #64748b; font-size: 0.9rem;">
            <div style="flex-grow: 1; height: 1px; background: #374151;"></div>
            <span style="padding: 0 15px;">or</span>
            <div style="flex-grow: 1; height: 1px; background: #374151;"></div>
        </div>

        <!-- Google Login Button -->
        <button id="googleBtn" style="width: 100%; padding: 12px; background: #fff; color: #1e293b; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;">
            <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
        </button>

    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
